services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infra_registry}
      POSTGRES_USER: ${POSTGRES_USER:-infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env (см. .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infra} -d ${POSTGRES_DB:-infra_registry}"]
      interval: 5s
      timeout: 5s
      retries: 20
  # Резервная копия PostgreSQL ПЕРЕД обновлением образа. Не запускается сама (профиль backup):
  #   docker compose --profile backup run --rm db-backup
  # Часть миграций необратима, а приложение применяет их при каждом старте контейнера: без копии вернуться к прежней версии нельзя.
  # Файл pg_dump (формат custom, восстанавливается pg_restore) пишется в том appdata, каталог db-backups; хранятся пять последних.
  # Для SQLite копию при старте делает сам образ (docker-entrypoint.sh).
  db-backup:
    profiles: ["backup"]
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-infra}
      PGDATABASE: ${POSTGRES_DB:-infra_registry}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env (см. .env.example)}
    volumes:
      - appdata:/backup
    entrypoint: ["sh", "-c"]
    # `$$` — экранирование для compose: в контейнер попадает одиночный `$`.
    command:
      - |
        set -eu
        mkdir -p /backup/db-backups
        target="/backup/db-backups/$${PGDATABASE}.$$(date +%Y%m%d-%H%M%S).dump"
        pg_dump --format=custom --file="$${target}.tmp"
        mv "$${target}.tmp" "$${target}"
        ls -1t /backup/db-backups/*.dump | tail -n +6 | xargs -r rm --
        echo "Резервная копия базы: $${target}"
  # ПЕРИОДИЧЕСКАЯ резервная копия PostgreSQL (профиль backup-schedule; без него сервис не стартует):
  #   docker compose --profile backup-schedule up -d db-backup-scheduled
  # Дамп (pg_dump, формат custom) пишется в каталог ХОСТА BACKUP_HOST_DIR (по умолчанию ./backups), а не в том appdata: потеря тома или
  # диска Docker не должна уничтожать и базу, и копии. Хранится BACKUP_KEEP последних, копия делается при старте сервиса и затем каждые
  # BACKUP_INTERVAL_SECONDS секунд. Каждый дамп проверяется `pg_restore --list` до переименования в .dump; сбой копирования виден в логе
  # (`docker compose logs db-backup-scheduled`), а healthcheck считает сервис нездоровым, если свежей копии нет дольше двух интервалов.
  # Копии содержат хеши паролей и журнал аудита: права только у владельца (umask 077), при выносе за пределы хоста шифруйте их.
  # Работает с сервисом `db` из этого файла; для внешнего PostgreSQL (DATABASE_URL) используйте средства поставщика или pg_dump на хосте.
  db-backup-scheduled:
    profiles: ["backup-schedule"]
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-infra}
      PGDATABASE: ${POSTGRES_DB:-infra_registry}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env (см. .env.example)}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backup
    healthcheck:
      test: ["CMD-SHELL", "find /backup -maxdepth 1 -name '*.dump' -mmin -$$(( (2 * BACKUP_INTERVAL_SECONDS + 59) / 60 )) | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    entrypoint: ["sh", "-c"]
    # `$$` — экранирование для compose: в контейнер попадает одиночный `$`. Неверное значение параметра — выход сразу, а не бесконечный цикл
    # копий; `sleep … & wait` и trap — чтобы `docker stop` останавливал сервис сразу, а не через 10 с по SIGKILL.
    command:
      - |
        set -eu
        umask 077
        case "$${BACKUP_INTERVAL_SECONDS}" in ''|*[!0-9]*|0) echo "BACKUP_INTERVAL_SECONDS: нужно целое число секунд больше нуля" >&2; exit 64;; esac
        case "$${BACKUP_KEEP}" in ''|*[!0-9]*|0) echo "BACKUP_KEEP: нужно целое число копий больше нуля" >&2; exit 64;; esac
        trap 'exit 0' TERM INT
        rm -f /backup/*.dump.tmp
        while true; do
          target="/backup/$${PGDATABASE}.$$(date +%Y%m%d-%H%M%S).dump"
          if pg_dump --format=custom --file="$${target}.tmp" && pg_restore --list "$${target}.tmp" > /dev/null; then
            mv "$${target}.tmp" "$${target}"
            echo "Резервная копия: $${target}"
            ls -1t /backup/*.dump | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -- || echo "ПРЕДУПРЕЖДЕНИЕ: не удалось удалить старые копии" >&2
          else
            rm -f "$${target}.tmp"
            echo "ОШИБКА резервного копирования" >&2
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}" & wait $$!
        done
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Адрес БД приложение собирает само из частей (app/config.py): пароль может содержать любые символы
      # (@ : / # % …) — в готовый DATABASE_URL их пришлось бы экранировать вручную. Внешний сервер или
      # нестандартные параметры: задайте DATABASE_URL в .env, он имеет приоритет над частями.
      DATABASE_URL: ${DATABASE_URL:-}
      INFRA_REGISTRY_DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env (см. .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-infra_registry}
      # CORS по умолчанию выключен (интерфейс отдаётся с того же origin) — список нужен только для
      # отдельного фронтенда, см. README, раздел «Безопасность по умолчанию».
      INFRA_REGISTRY_CORS_ORIGINS: ${INFRA_REGISTRY_CORS_ORIGINS:-}
      # Допустимые имена в заголовке Host (защита от DNS-rebinding: чужая веб-страница, перенацеленная на этот сервер,
      # приходит с Host = имя своего домена). По умолчанию — только локальные. Если сервер открывают по ИМЕНИ
      # (http://reestr.corp.local:8000), перечислите его: INFRA_REGISTRY_ALLOWED_HOSTS=localhost,127.0.0.1,reestr.corp.local
      # Значение '*' отключает проверку целиком — не используйте его при выключенной аутентификации.
      INFRA_REGISTRY_ALLOWED_HOSTS: ${INFRA_REGISTRY_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Host в виде IP-адреса (http://10.0.0.5:8000) принимается без перечисления: подменить IP-адрес через DNS нельзя, а при
      # rebinding в Host всегда стоит имя домена злоумышленника. Так обновление не ломает доступ по адресу сервера.
      INFRA_REGISTRY_ACCEPT_IP_HOSTS: ${INFRA_REGISTRY_ACCEPT_IP_HOSTS:-true}
      # Токен первичной настройки аутентификации — ОБЯЗАТЕЛЕН: из Docker адрес клиента не localhost, и без
      # токена заводить пользователей и включать аутентификацию через интерфейс нельзя (заголовок
      # X-Setup-Token), а выключенная аутентификация оставляет реестр открытым всем, кто достаёт до порта.
      INFRA_REGISTRY_SETUP_TOKEN: ${INFRA_REGISTRY_SETUP_TOKEN:?Задайте INFRA_REGISTRY_SETUP_TOKEN в .env (длинная случайная строка, например значение команды openssl rand -hex 24), см. .env.example}
      # Адреса прокси, которым доверяет uvicorn при определении IP клиента (X-Forwarded-For) — нужно
      # за обратным прокси, иначе в журнале аудита и сессиях будет адрес самого прокси.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Адреса и подсети клиентов, которым разрешено подключаться (через запятую). Пусто — без ограничений.
      # Без этой строки значение из .env до приложения не доходило: ограничение казалось включённым, а доступ был открыт.
      INFRA_REGISTRY_ALLOWED_CLIENTS: ${INFRA_REGISTRY_ALLOWED_CLIENTS:-}
      # Срок хранения отчётов (дней; 0 — не удалять) и квота их числа. Значения по умолчанию совпадают с config.py.
      INFRA_REGISTRY_REPORT_RETENTION_DAYS: ${INFRA_REGISTRY_REPORT_RETENTION_DAYS:-30}
      INFRA_REGISTRY_REPORT_MAX_FILES: ${INFRA_REGISTRY_REPORT_MAX_FILES:-}
      # Срок хранения записей журнала аудита, дней. 0 — не удалять никогда (по умолчанию). Значение из формы «Настройки аудита» важнее.
      INFRA_REGISTRY_AUDIT_RETENTION_DAYS: ${INFRA_REGISTRY_AUDIT_RETENTION_DAYS:-0}
      # Предел размера тела запроса, байт (0 — без проверки) и интерактивная документация API (1 — включить, только для разработки).
      INFRA_REGISTRY_MAX_REQUEST_BODY_BYTES: ${INFRA_REGISTRY_MAX_REQUEST_BODY_BYTES:-2097152}
      INFRA_REGISTRY_ENABLE_DOCS: ${INFRA_REGISTRY_ENABLE_DOCS:-}
      # Сессии и блокировка входа (действуют, когда аутентификация включена). Значения по умолчанию совпадают с config.py; пустым
      # числовое значение не оставляйте — в старых версиях приложение на нём не запускалось, поэтому явные умолчания, а не `:-`.
      INFRA_REGISTRY_SESSION_TTL_HOURS: ${INFRA_REGISTRY_SESSION_TTL_HOURS:-12}
      INFRA_REGISTRY_AUTH_MAX_ATTEMPTS: ${INFRA_REGISTRY_AUTH_MAX_ATTEMPTS:-10}
      INFRA_REGISTRY_AUTH_LOCKOUT_MINUTES: ${INFRA_REGISTRY_AUTH_LOCKOUT_MINUTES:-15}
      INFRA_REGISTRY_AUTH_MIN_PASSWORD_LENGTH: ${INFRA_REGISTRY_AUTH_MIN_PASSWORD_LENGTH:-8}
      INFRA_REGISTRY_AUTH_KNOWN_CLIENT_DAYS: ${INFRA_REGISTRY_AUTH_KNOWN_CLIENT_DAYS:-30}
      INFRA_REGISTRY_AUTH_LOCKOUT_KNOWN_CLIENT_BYPASS: ${INFRA_REGISTRY_AUTH_LOCKOUT_KNOWN_CLIENT_BYPASS:-1}
      # Пул соединений PostgreSQL. Пусто — значения SQLAlchemy (5 / 10 / 30 с).
      INFRA_REGISTRY_DB_POOL_SIZE: ${INFRA_REGISTRY_DB_POOL_SIZE:-}
      INFRA_REGISTRY_DB_MAX_OVERFLOW: ${INFRA_REGISTRY_DB_MAX_OVERFLOW:-}
      INFRA_REGISTRY_DB_POOL_TIMEOUT: ${INFRA_REGISTRY_DB_POOL_TIMEOUT:-}
      # Плановые копии SQLite средствами приложения (только при DATABASE_URL на SQLite; на PostgreSQL их делает сервис
      # db-backup-scheduled). Пусто — умолчания приложения: раз в 24 ч, 7 копий, каталог backups внутри тома данных.
      INFRA_REGISTRY_BACKUP_INTERVAL_HOURS: ${INFRA_REGISTRY_BACKUP_INTERVAL_HOURS:-}
      INFRA_REGISTRY_BACKUP_KEEP: ${INFRA_REGISTRY_BACKUP_KEEP:-}
      INFRA_REGISTRY_BACKUP_DIR: ${INFRA_REGISTRY_BACKUP_DIR:-}
      # INFRA_REGISTRY_CSP здесь намеренно НЕТ: пустая строка означает «отключить Content-Security-Policy», и `${…:-}` выключил бы
      # защиту у каждого, кто переменную не задавал. Нужна своя политика — docker-compose.override.yml с явным значением.
    volumes:
      # Каталог данных приложения: сформированные отчёты (а при DATABASE_URL на SQLite — и база). Код в образе
      # доступен только для чтения, писать процессу можно лишь сюда; без тома отчёты терялись при пересоздании контейнера.
      - appdata:/app/data
    ports:
      # По умолчанию порт доступен только с этого же компьютера (127.0.0.1). Для доступа по сети задайте
      # INFRA_REGISTRY_BIND=0.0.0.0 — но сначала включите аутентификацию (README, «Безопасность по умолчанию»).
      - "${INFRA_REGISTRY_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  appdata:
