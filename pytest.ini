[pytest]
testpaths = backend/tests
# Предупреждения, которые уже устранены, при возврате — ошибка (раздел 5 код-ревью): иначе два-три тысячи одинаковых строк снова
# закрыли бы собой новые. Остальные предупреждения остаются предупреждениями: новая устаревшая функция в зависимости не должна
# валить сборку. Прогон сейчас без предупреждений вовсе; ужесточить до `error::DeprecationWarning` можно, но тогда каждое обновление
# зависимостей будет требовать правки сразу.
filterwarnings =
    error:The default (date|datetime) adapter is deprecated:DeprecationWarning
    error:No path_separator found in configuration:DeprecationWarning
    error::pytest.PytestRemovedIn10Warning
