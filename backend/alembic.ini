[alembic]
script_location = alembic
prepend_sys_path = .
# Keep this file ASCII-only: alembic (configparser) and env.py (logging.config.fileConfig) read it in the system code page. On English Windows
# that is cp1252, which cannot decode UTF-8 Cyrillic, and InfraRegistry.exe failed on the first migration (tests/test_alembic_ini_encoding.py).
# The path separator for prepend_sys_path/version_locations is the OS one. Without an explicit value Alembic splits the string on spaces,
# commas and colons (deprecated, a warning on every run; a Windows path with "C:" would be cut at the colon).
path_separator = os
sqlalchemy.url = sqlite:///../infra_registry.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
