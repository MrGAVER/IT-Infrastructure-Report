[alembic]
script_location = alembic
prepend_sys_path = .
# Разделитель путей в prepend_sys_path/version_locations — разделитель ОС. Без явного значения Alembic разбирает строку по пробелам,
# запятым и двоеточиям (устаревший способ, предупреждение в каждом запуске; путь Windows с «C:» разрезался бы по двоеточию).
path_separator = os
sqlalchemy.url = sqlite:///../infra_registry.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
