# Автообновление зависимостей (A-10 код-ревью r3). Dependabot открывает PR; слияние — решение владельца после зелёного CI.
#
# Важно для pip: Dependabot правит только backend/requirements*.txt (диапазоны версий). Закреплённые файлы requirements*.lock с хешами
# он не понимает, а шаг CI «Lock-файлы backend актуальны» сравнивает их с .txt — поэтому PR с обновлением Python-зависимости покажет красный
# CI, пока lock не пересобран (README, «Зависимости backend»: uv pip compile … --generate-hashes). Это осознанная цена за воспроизводимые
# сборки; обновления безопасности pip-audit (gate в CI) находит независимо от Dependabot.
#
# Обновления собраны в группы по типу (минорные и патчи — одним PR), чтобы не получать десятки отдельных PR.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend-vue"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]
    # TypeScript 7 пока не ставится: vue-tsc и typescript-eslint не поддерживают его в peer-зависимостях, `npm ci` падает на разрешении
    # зависимостей (PR Dependabot #20). Снять правило, когда обе библиотеки объявят поддержку TypeScript 7 (проверка: `npm ci` и `vue-tsc -b`
    # на ветке с typescript@7).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Базовые образы backend/Dockerfile: тег и digest обновляются вместе.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Версии Python и Node закреплены сознательно: CI, lock-файлы (`--python-version 3.12`) и тесты идут на Python 3.12, фронтенд собирается и
    # проверяется на Node 22 (LTS), а test_the_pinned_images_are_the_ones_the_project_uses следит за тегами образов. Смена Python или Node —
    # отдельная миграция (Dockerfile, ci.yml, lock-файлы и тесты вместе), а не правка одной строки Dockerfile: PR #7 (python:3.15-slim) и
    # #8 (node:25-slim) ломали проверку образов, а контейнер на 3.15 не стартовал в compose-postgres. Правило не мешает обновлению digest
    # того же тега. Снимается правкой этого блока в той же миграции.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Действия CI закреплены по SHA с комментарием версии (# v4): Dependabot обновляет и SHA, и комментарий.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
