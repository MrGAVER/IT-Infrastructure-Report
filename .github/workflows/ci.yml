name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/tests/package-lock.json

      - name: Установить зависимости backend (runtime + dev)
        run: pip install -r backend/requirements-dev.txt

      - name: Установить зависимости frontend-тестов
        run: npm ci
        working-directory: frontend/tests

      - name: ruff (только реальные ошибки — pyflakes F + синтаксис E9)
        # Полный дефолтный набор ruff (стиль импортов, длина строк, пробелы) конфликтует с
        # сознательным плотным стилем автора (несколько операторов в строке через ';'/':').
        # F+E9 ловит настоящие баги (неиспользуемые/неопределённые имена, синтаксис), не стиль.
        run: ruff check backend/app --select F,E9 --line-length 400

      - name: Тесты backend (unittest + pytest, включая интеграционные)
        run: pytest -v

      - name: Тесты frontend (node:test + jsdom, чистые/DOM-функции app.js)
        run: npm test
        working-directory: frontend/tests

      - name: Проверка синтаксиса core.js/vm-editors.js/device-interfaces.js/csv-import.js/connections.js/app.js/report_builder.js
        run: |
          node --check frontend/static/core.js
          node --check frontend/static/vm-editors.js
          node --check frontend/static/device-interfaces.js
          node --check frontend/static/csv-import.js
          node --check frontend/static/connections.js
          node --check frontend/static/app.js
          node --check frontend/static/report_builder.js

      - name: Проверка сборки Docker-образа backend
        run: docker build -f backend/Dockerfile -t infra-registry-backend:ci .
