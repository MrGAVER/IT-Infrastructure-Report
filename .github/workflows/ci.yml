name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Раз в неделю (понедельник, 04:17 UTC) выполняется только job build-windows: сборка EXE с проверками уязвимостей пакетов и smoke-запуском.
  # Новая уязвимость в уже влитых зависимостях иначе осталась бы незамеченной до следующего PR. Остальные job по расписанию пропускаются
  # условием `if`. Расписание работает только в ветке по умолчанию, а о падении по расписанию GitHub сообщает тому, кто последним менял cron.
  schedule:
    - cron: "17 4 * * 1"
  # Ручной запуск (вкладка Actions) выполняет весь CI, а не только сборку под Windows.
  workflow_dispatch:

# Токену workflow достаточно чтения репозитория: CI ничего не публикует и не пишет в репозиторий.
permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Установить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Установить зависимости backend (runtime + dev)
        run: pip install --require-hashes -r backend/requirements-dev.lock

      - name: Установить зависимости frontend-vue
        run: npm ci
        working-directory: frontend-vue

      - name: npm audit frontend-vue (runtime-зависимости, уровень high и выше, с исключениями из scripts/audit-gate.mjs) — gate
        # Аналог pip-audit для frontend: известная уязвимость уровня high и выше в зависимости, которая попадает в сборку, блокирует слияние.
        # Это тот же `npm audit --omit=dev --audit-level=high`, но с явным списком исключений (id advisory, причина, срок): нужен, когда
        # исправленной версии ещё нет. Срок вышел или появилась другая уязвимость — шаг падает. Список — ALLOWLIST в scripts/audit-gate.mjs.
        run: npm run audit:gate
        working-directory: frontend-vue

      - name: npm audit frontend-vue (вместе с dev-зависимостями) — не блокирует
        # Цепочка dev-инструментов (eslint, prettier, vitest и их зависимости) в сборку не входит: шаг сообщает о замечаниях в журнале, но
        # не валит сборку — как pip-audit набора для EXE ниже.
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: frontend-vue

      - name: ESLint frontend-vue (npm run lint)
        run: npm run lint
        working-directory: frontend-vue

      - name: Prettier frontend-vue (npm run format:check — код отформатирован целиком, новые отклонения от стиля блокируют слияние)
        run: npm run format:check
        working-directory: frontend-vue

      - name: ruff (реальные ошибки — pyflakes F + синтаксис E9 — и сложность функций C901 ≤ 12, см. pyproject.toml)
        run: ruff check backend

      - name: ruff format --check (весь backend, кроме списка исключений в pyproject.toml)
        # Форматируется всё; исключения — модули, ещё не переведённые на форматтер ([tool.ruff.format] exclude в pyproject.toml, единственное
        # место списка). Новый модуль или тест форматируйте сразу; список только сокращается (тест test_code_style_limits.py не даёт ему расти).
        run: ruff format --check backend

      - name: bandit (статический анализ безопасности backend, уровень medium и выше) — gate
        # Дополняет pip-audit (уязвимости в зависимостях): здесь ищутся небезопасные приёмы в собственном коде. Сейчас чисто; неактуальные
        # срабатывания помечены `# nosec Bxxx` с пояснением прямо в коде. Низкий уровень (B105 на именах кодов ошибок и т. п.) не блокирует.
        run: bandit -r backend/app -ll

      - name: Lock-файлы backend актуальны (requirements*.lock соответствуют requirements*.txt, включая набор для сборки EXE)
        # Правили requirements.txt, но не пересобрали lock — Docker, CI и сборка EXE поставили бы старые версии. Пересборка идёт
        # с учётом уже закреплённых версий, поэтому при актуальном lock diff пуст. Как обновить — README, «Зависимости backend».
        run: |
          pip install uv
          cd backend
          uv pip compile requirements.txt --universal --generate-hashes --python-version 3.12 -o requirements.lock --no-header
          uv pip compile requirements-dev.txt --universal --generate-hashes --python-version 3.12 -o requirements-dev.lock --no-header
          uv pip compile requirements-build.txt --universal --generate-hashes --python-version 3.12 -o requirements-build.lock --no-header
          git diff --exit-code -- requirements.lock requirements-dev.lock requirements-build.lock

      - name: alembic check (SQLite) — схема из миграций совпадает с моделями
        # Изменили models.py и забыли миграцию (или наоборот) — «No new upgrade operations detected» не выйдет, слияние блокируется.
        # Строится пустая база цепочкой миграций, затем сравнивается с Base.metadata (compare_type и фильтр SQLite — alembic/env.py).
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/alembic_check.db
        run: |
          alembic upgrade head
          alembic check

      - name: pip-audit (известные уязвимости в закреплённых зависимостях runtime, requirements.lock) — gate
        run: pip-audit -r backend/requirements.lock --require-hashes

      - name: pip-audit набора для сборки EXE (requirements-build.lock) — не блокирует
        # Тот же runtime плюс PyInstaller и его зависимости: из EXE в продукт попадает всё это. PyInstaller и его хуки
        # изредка дают замечания, не относящиеся к рантайму, поэтому шаг сообщает о них, но не валит сборку.
        continue-on-error: true
        run: pip-audit -r backend/requirements-build.lock --require-hashes

      - name: Тесты backend (unittest + pytest, включая интеграционные) с измерением покрытия
        # Сводка по файлам с непокрытыми строками — в Summary job-а. Порог (fail_under) задан в pyproject.toml:
        # покрытие не должно падать ниже достигнутого; поднимайте порог вместе с ростом покрытия.
        # -n auto (pytest-xdist): тесты идут на SQLite in-memory/временных файлах и друг от друга не зависят, поэтому
        # раскладываются по ядрам раннера; pytest-cov сам собирает покрытие со всех процессов. Job-ы на PostgreSQL ниже
        # без -n: у них одна общая база, которую каждый тест очищает (TRUNCATE), — параллельные процессы мешали бы друг другу.
        # Тесты с меткой slow (test_report_layout_performance.py) проверяют время работы и на 2-ядерном раннере в паре со вторым
        # процессом и измерением покрытия выходят за лимит (3,8–4,0 с при лимите 3,0 с), поэтому идут отдельным шагом без -n,
        # а покрытие дописывается (--cov-append). Порог покрытия проверяет только второй шаг — по сумме обоих.
        # Бюджет «неожиданных» пропусков (ИА-08 код-ревью r3, backend/tests/skip_budget.py): отбор по базе SQLite/PostgreSQL не считается, остальное —
        # да. Сейчас их не больше двух: test_pyinstaller_spec.py (PyInstaller нет в requirements-dev.lock) и дымовой тест LibreOffice (`soffice` может
        # отсутствовать на раннере). Новый пропуск роняет сборку: поднимать число можно только осознанно, объяснив в коммите, зачем тест пропускается.
        # `-rs` печатает причины всех пропусков в сводке.
        env:
          INFRA_REGISTRY_MAX_UNEXPECTED_SKIPS: "2"
        run: |
          status=0
          pytest -n auto -m "not slow" -v -rs --cov --cov-fail-under=0 --cov-report= || status=$?
          pytest -m slow -v -rs --cov --cov-append --cov-report=term:skip-covered || status=$?
          { echo "### Покрытие тестами backend"; echo; coverage report --format=markdown --skip-covered --fail-under=0 || true; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Типы и сборка frontend-vue (vue-tsc + vite build) — концепция «Диспетчерская»
        run: npm run build
        working-directory: frontend-vue

      - name: Тесты frontend-vue (vitest, сторы catalogs/devices/theme + компоненты)
        # Любое `[Vue warn]` в тесте — ошибка этого теста (страж в src/__tests__/vueWarnings.ts, подключён в setup.ts), поэтому отдельного
        # порога по числу предупреждений здесь нет: планка нулевая. Нужное предупреждение тест забирает сам через takeVueWarnings().
        run: npm test
        working-directory: frontend-vue

      - name: Проверка сборки Docker-образа backend
        run: docker build -f backend/Dockerfile -t infra-registry-backend:ci .

      - name: Smoke-тест образа — контейнер стартует, применяет миграции и отвечает
        # docker build не ловит ошибку запуска (как BASE_DIR в 2.45.0): без этого шага «контейнер падает
        # на старте» обнаружился бы только у пользователя. БД — SQLite внутри контейнера (по умолчанию).
        run: |
          docker run -d --name infra-registry-smoke -p 8000:8000 infra-registry-backend:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health && curl -fsS -o /dev/null http://localhost:8000/; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs infra-registry-smoke
          docker rm -f infra-registry-smoke
          test "$ok" = 1

  # Проверки интерфейса в настоящем браузере (Playwright, Chromium): мобильное меню, иконки, шрифты и вёрстка 17 экранов на трёх
  # размерах окна. Юнит-тесты vitest раскладку не считают (jsdom), поэтому обрезанное меню, пустые иконки спрайта и запросы к
  # внешнему CDN ловятся только здесь. backend поднимается на чистой SQLite (frontend-vue/e2e/start-backend.mjs), фронтенд
  # собирается самим `npm run e2e`. Описание и переменные окружения — frontend-vue/README.md, «E2E-проверки интерфейса».
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Установить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Установить зависимости backend (runtime — для запуска приложения в проверках)
        run: pip install --require-hashes -r backend/requirements.lock

      - name: Установить зависимости frontend-vue
        run: npm ci
        working-directory: frontend-vue

      - name: Установить Chromium для Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend-vue

      - name: E2E-проверки интерфейса (сборка frontend-vue + Playwright)
        run: npm run e2e
        working-directory: frontend-vue

      - name: Отчёт и трассировки Playwright (только при падении)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend-vue/playwright-report/
            frontend-vue/test-results/
          retention-days: 7

  # Серверный режим, каким его получают пользователи: `docker compose up` — приложение в контейнере поверх PostgreSQL 16 из
  # docker-compose.yml. Шаг «Smoke-тест образа» в job `test` проверяет контейнер на SQLite, а job `test-postgres-migrations` —
  # PostgreSQL и цепочку миграций, но не сам compose: переменные окружения, зависимость app от здоровья db, сборку адреса БД из частей
  # (app/config.py) и запуск `alembic upgrade head` ИЗ контейнера против PostgreSQL проверяет только этот job. Значения ниже — тестовые,
  # на настоящий сервер не попадают (разовая виртуальная машина раннера).
  compose-postgres:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-compose-smoke-pg-password
      INFRA_REGISTRY_SETUP_TOKEN: ci-compose-smoke-setup-token-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker compose up (приложение + PostgreSQL) — стартует, применяет миграции и отвечает
        run: |
          docker compose up -d --build
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health && curl -fsS -o /dev/null http://127.0.0.1:8000/; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1

      - name: Миграции действительно прошли на PostgreSQL (а не на SQLite внутри контейнера)
        # Без этой проверки приложение, молча упавшее на файловую SQLite, тоже ответило бы на /health.
        run: |
          rev=$(docker compose exec -T db psql -U infra -d infra_registry -tAc "SELECT version_num FROM alembic_version")
          echo "alembic_version в PostgreSQL: $rev"
          test -n "$rev"
          tables=$(docker compose exec -T db psql -U infra -d infra_registry -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          echo "таблиц в схеме public: $tables"
          test "$tables" -gt 10

      - name: Журналы контейнеров (при падении)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Остановить и удалить контейнеры и тома
        if: always()
        run: docker compose down -v

  # Серверный режим приложения работает на PostgreSQL (docker-compose.yml), а job `test` выше идёт на SQLite.
  # Здесь тот же набор тестов backend выполняется на PostgreSQL 16: порядок строк, блокировки FOR UPDATE, частичные
  # индексы и типы ведут себя иначе, чем в SQLite. Схема создаётся из моделей (см. tests/conftest.py,
  # INFRA_REGISTRY_TEST_DATABASE_URL); тесты миграций на SQLite работают на собственных файлах и от этого не зависят.
  # Цепочку Alembic на чистой PostgreSQL проверяют tests/test_migrations_postgres.py (идут и здесь) и job ниже.
  test-postgres:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: infra
          POSTGRES_PASSWORD: infra_test
          POSTGRES_DB: infra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infra -d infra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INFRA_REGISTRY_TEST_DATABASE_URL: postgresql+psycopg://infra:infra_test@localhost:5432/infra_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Установить зависимости backend (runtime + dev)
        run: pip install --require-hashes -r backend/requirements-dev.lock

      - name: Тесты backend на PostgreSQL
        # Бюджет неожиданных пропусков — как в job `test` (там же объяснение).
        env:
          INFRA_REGISTRY_MAX_UNEXPECTED_SKIPS: "2"
        run: pytest -v -rs

  # Тот же набор тестов на PostgreSQL, но схема собрана цепочкой миграций Alembic (`alembic upgrade head`), как при
  # первом запуске docker-compose, а не из моделей: так проверяется схема, которую получат реальные установки.
  # Затем приложение запускается живьём на пустой базе (alembic upgrade head → uvicorn → API → Excel-отчёт).
  test-postgres-migrations:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: infra
          POSTGRES_PASSWORD: infra_test
          POSTGRES_DB: infra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infra -d infra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INFRA_REGISTRY_TEST_DATABASE_URL: postgresql+psycopg://infra:infra_test@localhost:5432/infra_test
      INFRA_REGISTRY_TEST_SCHEMA: migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Установить зависимости backend (runtime + dev)
        run: pip install --require-hashes -r backend/requirements-dev.lock

      - name: alembic check (PostgreSQL) — схема из миграций совпадает с моделями
        # Отдельная чистая база: на PostgreSQL сравниваются и имена ограничений (на SQLite безымянные UNIQUE пропускаются).
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://infra:infra_test@localhost:5432/infra_alembic_check
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://infra:infra_test@localhost:5432/infra_test", autocommit=True) as connection:
              connection.execute("CREATE DATABASE infra_alembic_check")
          PY
          alembic upgrade head
          alembic check

      - name: Тесты backend на PostgreSQL (схема из миграций)
        # Бюджет неожиданных пропусков — как в job `test` (там же объяснение).
        env:
          INFRA_REGISTRY_MAX_UNEXPECTED_SKIPS: "2"
        run: pytest -v -rs

      - name: Живой запуск приложения на PostgreSQL
        working-directory: backend
        env:
          # Так сервер настраивает docker-compose.yml: части вместо готового адреса, пароль со спецсимволами
          # (раньше «@» в пароле ломал адрес). Роль и база создаются тут, пароль проверяется сервером по-настоящему.
          INFRA_REGISTRY_DB_HOST: localhost
          POSTGRES_USER: smoke_user
          POSTGRES_PASSWORD: "p@ss:w/rd#1%41?"
          POSTGRES_DB: infra_smoke
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect("postgresql://infra:infra_test@localhost:5432/infra_test", autocommit=True) as connection:
              connection.execute(psycopg.sql.SQL("CREATE ROLE {} LOGIN PASSWORD {}").format(psycopg.sql.Identifier(os.environ["POSTGRES_USER"]), psycopg.sql.Literal(os.environ["POSTGRES_PASSWORD"])))
              connection.execute(psycopg.sql.SQL("CREATE DATABASE {} OWNER {}").format(psycopg.sql.Identifier(os.environ["POSTGRES_DB"]), psycopg.sql.Identifier(os.environ["POSTGRES_USER"])))
          PY
          python tests/tools/pg_app_smoke.py

  # Сборка EXE под Windows тем же installer\build_windows.bat, которым собирает разработчик. Вместе со сборкой проходят проверки
  # уязвимостей пакетов — их делает сам скрипт: `npm run audit:gate` и pip-audit по requirements.lock блокируют сборку, pip-audit
  # по requirements-build.lock только сообщает (как одноимённые шаги job test). Linux-job test проверяет те же lock-файлы, но не
  # может проверить, что EXE вообще собирается и что скрипт работает под cmd.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-build.lock

      - name: Установить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend-vue/package-lock.json

      # Единственная команда шага: код возврата шага — это код возврата .bat, ошибка любой проверки или сборки краснит job.
      - name: Собрать EXE (installer\build_windows.bat — npm audit gate, pip-audit по lock-файлам, PyInstaller)
        shell: cmd
        run: call installer\build_windows.bat

      - name: Проверить результат сборки (EXE и сопутствующие файлы)
        shell: cmd
        run: |
          if not exist dist\InfraRegistry.exe exit /b 1
          if not exist dist\README_EXE.md exit /b 1
          if not exist dist\run_infra_registry.bat exit /b 1
          dir dist

      # Smoke: собранный EXE стартует на своём порту с базой во временном каталоге, мигрирует её и отвечает. Без этой проверки пакет без alembic
      # или без frontend-vue/dist собирался «успешно» и падал только у пользователя. Не проверяет вход в систему и экспорт .vsdx.
      - name: Smoke-запуск dist\InfraRegistry.exe (health, версия, интерфейс, миграции)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $port = 8765
          $base = "http://127.0.0.1:$port"
          $data = Join-Path $env:RUNNER_TEMP 'infra-smoke'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:INFRA_REGISTRY_DATA_DIR = $data
          $exe = $null
          try {
            $exe = Start-Process -FilePath (Resolve-Path 'dist\InfraRegistry.exe') -ArgumentList '--no-browser', '--port', $port `
              -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput (Join-Path $data 'exe.out.log') -RedirectStandardError (Join-Path $data 'exe.err.log')
            $health = $null
            for ($i = 0; $i -lt 60 -and -not $health; $i++) {
              if ($exe.HasExited) { throw "InfraRegistry.exe завершился при старте, код $($exe.ExitCode)" }
              try { $health = Invoke-RestMethod -Uri "$base/api/v1/health" -TimeoutSec 3 } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $health) { throw 'InfraRegistry.exe не ответил на /api/v1/health за 120 с' }
            Write-Host "health: $($health | ConvertTo-Json -Compress)"
            $expected = (Select-String -Path 'backend\app\config.py' -Pattern '^APP_VERSION\s*=\s*[''"]([^''"]+)[''"]').Matches[0].Groups[1].Value
            if ($health.status -ne 'ok' -or $health.service -ne 'infra-registry') { throw "неожиданный ответ health: $($health | ConvertTo-Json -Compress)" }
            if ($health.version -ne $expected) { throw "версия в EXE $($health.version), в backend\app\config.py $expected" }
            $page = Invoke-WebRequest -Uri "$base/" -UseBasicParsing -TimeoutSec 10
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'id="app"') { throw 'собранный интерфейс не раздаётся: на / нет <div id="app">' }
            $probe = Join-Path $data 'probe_db.py'
            @'
          import sqlite3, sys
          connection = sqlite3.connect(sys.argv[1])
          tables = [row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type = 'table'")]
          revisions = [row[0] for row in connection.execute("SELECT version_num FROM alembic_version")]
          print("tables:", len(tables), "alembic_version:", revisions)
          sys.exit(0 if len(tables) > 10 and revisions else 1)
          '@ | Set-Content -Path $probe -Encoding ascii
            python $probe (Join-Path $data 'infra_registry.db')
            if ($LASTEXITCODE -ne 0) { throw 'в infra_registry.db нет схемы или ревизии alembic: миграции внутри EXE не прошли' }
          } catch {
            # Причина — в аннотацию (видна на странице запуска и в API), затем падаем: журнал шага не всегда под рукой.
            $reason = $_.Exception.Message -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=Smoke-запуск EXE::$reason"
            throw
          } finally {
            # onefile-EXE — загрузчик и дочерний процесс: останавливаем всё дерево, иначе порт останется занятым.
            if ($exe -and -not $exe.HasExited) { taskkill /PID $exe.Id /T /F | Out-Null }
          }
          $global:LASTEXITCODE = 0

      - name: Журналы EXE (при падении)
        if: failure()
        shell: pwsh
        run: |
          foreach ($name in 'exe.out.log', 'exe.err.log') {
            $path = Join-Path $env:RUNNER_TEMP "infra-smoke\$name"
            Write-Host "=== $name"
            if (-not (Test-Path $path)) { Write-Host '(файла нет)'; continue }
            $tail = (Get-Content -Path $path -Tail 40) -join "`n"
            Write-Host $tail
            if ($tail) {
              $encoded = $tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Host "::error title=Журнал $name (последние строки)::$encoded"
            }
          }
