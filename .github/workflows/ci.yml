name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Токену workflow достаточно чтения репозитория: CI ничего не публикует и не пишет в репозиторий.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Установить Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Установить зависимости backend (runtime + dev)
        run: pip install -r backend/requirements-dev.txt

      - name: Установить зависимости frontend-vue
        run: npm ci
        working-directory: frontend-vue

      - name: ruff (только реальные ошибки — pyflakes F + синтаксис E9, см. pyproject.toml)
        run: ruff check backend

      - name: pip-audit (известные уязвимости в зависимостях runtime, см. requirements.txt) — gate
        run: pip-audit -r backend/requirements.txt

      - name: Тесты backend (unittest + pytest, включая интеграционные)
        run: pytest -v

      - name: Типы и сборка frontend-vue (vue-tsc + vite build) — концепция «Диспетчерская»
        run: npm run build
        working-directory: frontend-vue

      - name: Тесты frontend-vue (vitest, сторы catalogs/devices/theme + компоненты)
        run: npm test
        working-directory: frontend-vue

      - name: Проверка сборки Docker-образа backend
        run: docker build -f backend/Dockerfile -t infra-registry-backend:ci .

      - name: Smoke-тест образа — контейнер стартует, применяет миграции и отвечает
        # docker build не ловит ошибку запуска (как BASE_DIR в 2.45.0): без этого шага «контейнер падает
        # на старте» обнаружился бы только у пользователя. БД — SQLite внутри контейнера (по умолчанию).
        run: |
          docker run -d --name infra-registry-smoke -p 8000:8000 infra-registry-backend:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health && curl -fsS -o /dev/null http://localhost:8000/; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs infra-registry-smoke
          docker rm -f infra-registry-smoke
          test "$ok" = 1
