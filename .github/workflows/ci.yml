name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Токену workflow достаточно чтения репозитория: CI ничего не публикует и не пишет в репозиторий.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Установить Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Установить зависимости backend (runtime + dev)
        run: pip install --require-hashes -r backend/requirements-dev.lock

      - name: Установить зависимости frontend-vue
        run: npm ci
        working-directory: frontend-vue

      - name: npm audit frontend-vue (runtime-зависимости, уровень high и выше) — gate
        # Аналог pip-audit для frontend: известная уязвимость уровня high и выше в зависимости, которая попадает в сборку, блокирует слияние.
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend-vue

      - name: npm audit frontend-vue (вместе с dev-зависимостями) — не блокирует
        # Цепочка dev-инструментов (eslint, prettier, vitest и их зависимости) в сборку не входит: шаг сообщает о замечаниях в журнале, но
        # не валит сборку — как pip-audit набора для EXE ниже.
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: frontend-vue

      - name: ESLint frontend-vue (npm run lint)
        run: npm run lint
        working-directory: frontend-vue

      - name: Prettier frontend-vue (npm run format:check — код отформатирован целиком, новые отклонения от стиля блокируют слияние)
        run: npm run format:check
        working-directory: frontend-vue

      - name: ruff (реальные ошибки — pyflakes F + синтаксис E9 — и сложность функций C901 ≤ 12, см. pyproject.toml)
        run: ruff check backend

      - name: ruff format --check (модули границы API и модули, переведённые на форматтер при код-ревью)
        # Остальной backend написан плотным стилем автора (pyproject.toml: line-length = 400) и форматируется постепенно: при каждом
        # изменении модуля его форматируют целиком ОТДЕЛЬНЫМ коммитом (без логики) и добавляют в список ниже; расхождение блокирует слияние.
        # Список только растёт. Ещё не переведены «горячие» файлы app/config.py и app/main.py (их правят почти все изменения — перевод
        # даст конфликты слияния) и модули без правок в этом цикле.
        run: >
          ruff format --check
          backend/app/api/*_schemas.py
          backend/app/api/schema_base.py
          backend/app/api/diagrams.py
          backend/app/api/reports.py
          backend/app/constants.py
          backend/app/services/body_limit.py
          backend/app/services/request_errors.py
          backend/app/services/audit_export.py
          backend/app/services/report_cleanup.py
          backend/app/services/exe_settings.py
          backend/app/services/diagram_icons.py
          backend/app/services/auth/_common.py
          backend/app/services/auth/guards.py
          backend/app/services/auth/login.py
          backend/app/services/crud/__init__.py
          backend/app/services/diagram_export/*.py

      - name: bandit (статический анализ безопасности backend, уровень medium и выше) — gate
        # Дополняет pip-audit (уязвимости в зависимостях): здесь ищутся небезопасные приёмы в собственном коде. Сейчас чисто; неактуальные
        # срабатывания помечены `# nosec Bxxx` с пояснением прямо в коде. Низкий уровень (B105 на именах кодов ошибок и т. п.) не блокирует.
        run: bandit -r backend/app -ll

      - name: Lock-файлы backend актуальны (requirements*.lock соответствуют requirements*.txt, включая набор для сборки EXE)
        # Правили requirements.txt, но не пересобрали lock — Docker, CI и сборка EXE поставили бы старые версии. Пересборка идёт
        # с учётом уже закреплённых версий, поэтому при актуальном lock diff пуст. Как обновить — README, «Зависимости backend».
        run: |
          pip install uv
          cd backend
          uv pip compile requirements.txt --universal --generate-hashes --python-version 3.12 -o requirements.lock --no-header
          uv pip compile requirements-dev.txt --universal --generate-hashes --python-version 3.12 -o requirements-dev.lock --no-header
          uv pip compile requirements-build.txt --universal --generate-hashes --python-version 3.12 -o requirements-build.lock --no-header
          git diff --exit-code -- requirements.lock requirements-dev.lock requirements-build.lock

      - name: alembic check (SQLite) — схема из миграций совпадает с моделями
        # Изменили models.py и забыли миграцию (или наоборот) — «No new upgrade operations detected» не выйдет, слияние блокируется.
        # Строится пустая база цепочкой миграций, затем сравнивается с Base.metadata (compare_type и фильтр SQLite — alembic/env.py).
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/alembic_check.db
        run: |
          alembic upgrade head
          alembic check

      - name: pip-audit (известные уязвимости в закреплённых зависимостях runtime, requirements.lock) — gate
        run: pip-audit -r backend/requirements.lock --require-hashes

      - name: pip-audit набора для сборки EXE (requirements-build.lock) — не блокирует
        # Тот же runtime плюс PyInstaller и его зависимости: из EXE в продукт попадает всё это. PyInstaller и его хуки
        # изредка дают замечания, не относящиеся к рантайму, поэтому шаг сообщает о них, но не валит сборку.
        continue-on-error: true
        run: pip-audit -r backend/requirements-build.lock --require-hashes

      - name: Тесты backend (unittest + pytest, включая интеграционные) с измерением покрытия
        # Сводка по файлам с непокрытыми строками — в Summary job-а. Порог (fail_under) задан в pyproject.toml:
        # покрытие не должно падать ниже достигнутого; поднимайте порог вместе с ростом покрытия.
        # -n auto (pytest-xdist): тесты идут на SQLite in-memory/временных файлах и друг от друга не зависят, поэтому
        # раскладываются по ядрам раннера; pytest-cov сам собирает покрытие со всех процессов. Job-ы на PostgreSQL ниже
        # без -n: у них одна общая база, которую каждый тест очищает (TRUNCATE), — параллельные процессы мешали бы друг другу.
        # Тесты с меткой slow (test_report_layout_performance.py) проверяют время работы и на 2-ядерном раннере в паре со вторым
        # процессом и измерением покрытия выходят за лимит (3,8–4,0 с при лимите 3,0 с), поэтому идут отдельным шагом без -n,
        # а покрытие дописывается (--cov-append). Порог покрытия проверяет только второй шаг — по сумме обоих.
        run: |
          status=0
          pytest -n auto -m "not slow" -v --cov --cov-fail-under=0 --cov-report= || status=$?
          pytest -m slow -v --cov --cov-append --cov-report=term:skip-covered || status=$?
          { echo "### Покрытие тестами backend"; echo; coverage report --format=markdown --skip-covered --fail-under=0 || true; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Типы и сборка frontend-vue (vue-tsc + vite build) — концепция «Диспетчерская»
        run: npm run build
        working-directory: frontend-vue

      - name: Тесты frontend-vue (vitest, сторы catalogs/devices/theme + компоненты)
        run: npm test
        working-directory: frontend-vue

      - name: Проверка сборки Docker-образа backend
        run: docker build -f backend/Dockerfile -t infra-registry-backend:ci .

      - name: Smoke-тест образа — контейнер стартует, применяет миграции и отвечает
        # docker build не ловит ошибку запуска (как BASE_DIR в 2.45.0): без этого шага «контейнер падает
        # на старте» обнаружился бы только у пользователя. БД — SQLite внутри контейнера (по умолчанию).
        run: |
          docker run -d --name infra-registry-smoke -p 8000:8000 infra-registry-backend:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health && curl -fsS -o /dev/null http://localhost:8000/; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs infra-registry-smoke
          docker rm -f infra-registry-smoke
          test "$ok" = 1

  # Проверки интерфейса в настоящем браузере (Playwright, Chromium): мобильное меню, иконки, шрифты и вёрстка 17 экранов на трёх
  # размерах окна. Юнит-тесты vitest раскладку не считают (jsdom), поэтому обрезанное меню, пустые иконки спрайта и запросы к
  # внешнему CDN ловятся только здесь. backend поднимается на чистой SQLite (frontend-vue/e2e/start-backend.mjs), фронтенд
  # собирается самим `npm run e2e`. Описание и переменные окружения — frontend-vue/README.md, «E2E-проверки интерфейса».
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Установить Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Установить зависимости backend (runtime — для запуска приложения в проверках)
        run: pip install --require-hashes -r backend/requirements.lock

      - name: Установить зависимости frontend-vue
        run: npm ci
        working-directory: frontend-vue

      - name: Установить Chromium для Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend-vue

      - name: E2E-проверки интерфейса (сборка frontend-vue + Playwright)
        run: npm run e2e
        working-directory: frontend-vue

      - name: Отчёт и трассировки Playwright (только при падении)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            frontend-vue/playwright-report/
            frontend-vue/test-results/
          retention-days: 7

  # Серверный режим приложения работает на PostgreSQL (docker-compose.yml), а job `test` выше идёт на SQLite.
  # Здесь тот же набор тестов backend выполняется на PostgreSQL 16: порядок строк, блокировки FOR UPDATE, частичные
  # индексы и типы ведут себя иначе, чем в SQLite. Схема создаётся из моделей (см. tests/conftest.py,
  # INFRA_REGISTRY_TEST_DATABASE_URL); тесты миграций на SQLite работают на собственных файлах и от этого не зависят.
  # Цепочку Alembic на чистой PostgreSQL проверяют tests/test_migrations_postgres.py (идут и здесь) и job ниже.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: infra
          POSTGRES_PASSWORD: infra_test
          POSTGRES_DB: infra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infra -d infra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INFRA_REGISTRY_TEST_DATABASE_URL: postgresql+psycopg://infra:infra_test@localhost:5432/infra_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Установить зависимости backend (runtime + dev)
        run: pip install --require-hashes -r backend/requirements-dev.lock

      - name: Тесты backend на PostgreSQL
        run: pytest -v

  # Тот же набор тестов на PostgreSQL, но схема собрана цепочкой миграций Alembic (`alembic upgrade head`), как при
  # первом запуске docker-compose, а не из моделей: так проверяется схема, которую получат реальные установки.
  # Затем приложение запускается живьём на пустой базе (alembic upgrade head → uvicorn → API → Excel-отчёт).
  test-postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: infra
          POSTGRES_PASSWORD: infra_test
          POSTGRES_DB: infra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infra -d infra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INFRA_REGISTRY_TEST_DATABASE_URL: postgresql+psycopg://infra:infra_test@localhost:5432/infra_test
      INFRA_REGISTRY_TEST_SCHEMA: migrations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Установить зависимости backend (runtime + dev)
        run: pip install --require-hashes -r backend/requirements-dev.lock

      - name: alembic check (PostgreSQL) — схема из миграций совпадает с моделями
        # Отдельная чистая база: на PostgreSQL сравниваются и имена ограничений (на SQLite безымянные UNIQUE пропускаются).
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://infra:infra_test@localhost:5432/infra_alembic_check
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://infra:infra_test@localhost:5432/infra_test", autocommit=True) as connection:
              connection.execute("CREATE DATABASE infra_alembic_check")
          PY
          alembic upgrade head
          alembic check

      - name: Тесты backend на PostgreSQL (схема из миграций)
        run: pytest -v

      - name: Живой запуск приложения на PostgreSQL
        working-directory: backend
        env:
          # Так сервер настраивает docker-compose.yml: части вместо готового адреса, пароль со спецсимволами
          # (раньше «@» в пароле ломал адрес). Роль и база создаются тут, пароль проверяется сервером по-настоящему.
          INFRA_REGISTRY_DB_HOST: localhost
          POSTGRES_USER: smoke_user
          POSTGRES_PASSWORD: "p@ss:w/rd#1%41?"
          POSTGRES_DB: infra_smoke
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect("postgresql://infra:infra_test@localhost:5432/infra_test", autocommit=True) as connection:
              connection.execute(psycopg.sql.SQL("CREATE ROLE {} LOGIN PASSWORD {}").format(psycopg.sql.Identifier(os.environ["POSTGRES_USER"]), psycopg.sql.Literal(os.environ["POSTGRES_PASSWORD"])))
              connection.execute(psycopg.sql.SQL("CREATE DATABASE {} OWNER {}").format(psycopg.sql.Identifier(os.environ["POSTGRES_DB"]), psycopg.sql.Identifier(os.environ["POSTGRES_USER"])))
          PY
          python tests/tools/pg_app_smoke.py
