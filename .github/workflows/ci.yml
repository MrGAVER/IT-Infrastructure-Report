name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Токену workflow достаточно чтения репозитория: CI ничего не публикует и не пишет в репозиторий.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Установить Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Установить зависимости backend (runtime + dev)
        run: pip install --require-hashes -r backend/requirements-dev.lock

      - name: Установить зависимости frontend-vue
        run: npm ci
        working-directory: frontend-vue

      - name: ruff (только реальные ошибки — pyflakes F + синтаксис E9, см. pyproject.toml)
        run: ruff check backend

      - name: Lock-файлы backend актуальны (requirements.lock / requirements-dev.lock соответствуют requirements*.txt)
        # Правили requirements.txt, но не пересобрали lock — Docker и CI поставили бы старые версии. Пересборка идёт с
        # учётом уже закреплённых версий, поэтому при актуальном lock diff пуст. Как обновить — README, «Зависимости backend».
        run: |
          pip install uv
          cd backend
          uv pip compile requirements.txt --universal --generate-hashes --python-version 3.12 -o requirements.lock --no-header
          uv pip compile requirements-dev.txt --universal --generate-hashes --python-version 3.12 -o requirements-dev.lock --no-header
          git diff --exit-code -- requirements.lock requirements-dev.lock

      - name: pip-audit (известные уязвимости в закреплённых зависимостях runtime, requirements.lock) — gate
        run: pip-audit -r backend/requirements.lock --require-hashes

      - name: Тесты backend (unittest + pytest, включая интеграционные)
        run: pytest -v

      - name: Типы и сборка frontend-vue (vue-tsc + vite build) — концепция «Диспетчерская»
        run: npm run build
        working-directory: frontend-vue

      - name: Тесты frontend-vue (vitest, сторы catalogs/devices/theme + компоненты)
        run: npm test
        working-directory: frontend-vue

      - name: Проверка сборки Docker-образа backend
        run: docker build -f backend/Dockerfile -t infra-registry-backend:ci .

      - name: Smoke-тест образа — контейнер стартует, применяет миграции и отвечает
        # docker build не ловит ошибку запуска (как BASE_DIR в 2.45.0): без этого шага «контейнер падает
        # на старте» обнаружился бы только у пользователя. БД — SQLite внутри контейнера (по умолчанию).
        run: |
          docker run -d --name infra-registry-smoke -p 8000:8000 infra-registry-backend:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health && curl -fsS -o /dev/null http://localhost:8000/; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs infra-registry-smoke
          docker rm -f infra-registry-smoke
          test "$ok" = 1

  # Серверный режим приложения работает на PostgreSQL (docker-compose.yml), а job `test` выше идёт на SQLite.
  # Здесь тот же набор тестов backend выполняется на PostgreSQL 16: порядок строк, блокировки FOR UPDATE, частичные
  # индексы и типы ведут себя иначе, чем в SQLite. Схема создаётся из моделей (см. tests/conftest.py,
  # INFRA_REGISTRY_TEST_DATABASE_URL); тесты миграций работают на собственных файлах SQLite и от этого не зависят.
  # Цепочка Alembic на чистой PostgreSQL этим job НЕ проверяется — она пока не проходит, см. README, «Известные ограничения».
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: infra
          POSTGRES_PASSWORD: infra_test
          POSTGRES_DB: infra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infra -d infra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INFRA_REGISTRY_TEST_DATABASE_URL: postgresql+psycopg://infra:infra_test@localhost:5432/infra_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Установить зависимости backend (runtime + dev)
        run: pip install --require-hashes -r backend/requirements-dev.lock

      - name: Тесты backend на PostgreSQL
        run: pytest -v
