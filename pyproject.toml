[tool.ruff]
line-length = 400
extend-exclude = ["frontend"]

# Форматтер (`ruff format`) применяется ко всему backend, КРОМЕ списка исключений ниже: CI проверяет `ruff format --check backend`, поэтому каждый
# новый модуль и тест форматируется автоматически (до ИА-05 код-ревью r3 было наоборот: новый файл не форматировался, пока его не вносили в список
# в трёх местах). Код написан плотно сознательно (line-length = 400); исключения — модули, ещё не переведённые на форматтер.
# Список только сокращается: изменили модуль — отформатируйте его целиком ОТДЕЛЬНЫМ коммитом (без логики; AST до и после должен совпасть),
# удалите из списка и уменьшите MAX_EXCLUDED_FILES в backend/tests/test_code_style_limits.py (тест не даёт списку расти и ловит записи, которые
# уже не нужны). Предел line-length снижают (план — 140) по мере перевода; тот же тест не даёт строкам превысить текущий предел.

[tool.ruff.format]
exclude = [
  "backend/alembic/versions/*.py",  # исторические миграции не переписываем (так же, как в per-file-ignores ниже)
  # Alembic
  # backend/app: 91 модулей. «Горячие» app/config.py и app/main.py правят почти все изменения — их форматируют отдельным коммитом
  # backend/tests: 180 модулей
  "backend/tests/test_referential_integrity.py",
  "backend/tests/test_registry_display_names.py",
  "backend/tests/test_report_builder.py",
  "backend/tests/test_report_download_access.py",
  "backend/tests/test_report_endpoint_limits.py",
  "backend/tests/test_request_body_cleanup.py",
  "backend/tests/test_request_body_schemas.py",
  "backend/tests/test_request_errors.py",
  "backend/tests/test_request_errors_contract.py",
  "backend/tests/test_resources_access.py",
  "backend/tests/test_rule_from_payload_behaviour.py",
  "backend/tests/test_serial_number_not_unique.py",
  "backend/tests/test_setup_token_throttle.py",
  "backend/tests/test_stale_subinterfaces_report.py",
  "backend/tests/test_support_crypto_device_links.py",
  "backend/tests/test_sync_interfaces_behaviour.py",
  "backend/tests/test_timeutil.py",
  "backend/tests/test_validate_resource_registry.py",
  "backend/tests/test_viewer_read_only_posts.py",
  "backend/tests/test_vlan_move_between_domains.py",
  "backend/tests/test_vm_nested_lists_sync.py",
  "backend/tests/test_vm_open_ports_sync.py",
  "backend/tests/test_wrong_current_password.py",
  "backend/tests/tools/pg_app_smoke.py",
  "backend/tests/xlsx_helpers.py",
]

[tool.ruff.lint]
# Только реальные ошибки: pyflakes (неиспользуемые/неопределённые имена и т.п.) + синтаксис.
# Полный дефолтный набор ruff (стиль импортов, длина строк, пробелы) конфликтует с сознательным
# плотным стилем автора (несколько операторов в строке через ';'/':'). Тот же выбор правил, что
# и в .github/workflows/ci.yml — вынесен сюда, чтобы `ruff check` без флагов (в т.ч. из IDE-
# плагина) давал тот же результат локально, что и CI, без необходимости помнить флаги команды.
select = ["F", "E9", "C901", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
# Цикломатическая сложность функции не выше 12 (код-ревью, п. 10). Правило включено для всего проекта, чтобы код не
# усложнялся. Долг по функциям приложения закрыт (2.155.0): единственное исключение ниже — исторические миграции
# Alembic, которые не переписывают. Не добавляйте в список новые файлы — разбирайте функцию на шаги.
max-complexity = 12

[tool.ruff.lint.pylint]
# Дополняют C901: функция может иметь низкую цикломатическую сложность и всё равно быть длинной простынёй.
# PLR0912 — ветвей (if/for/while/try/except) не больше 12; PLR0915 — операторов в теле не больше 50;
# PLR0911 — return не больше 6 (значение по умолчанию задано явно, чтобы порог был виден здесь).
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]  # исторические миграции не переписываем
"backend/tests/*" = ["PLR0911", "PLR0912", "PLR0915"]      # тесты — длинные линейные сценарии; пороги нужны коду приложения
# Долг на 2.158.0: функции, превышающие пороги выше. Список только сокращается — новые файлы не добавляйте, разбирайте функцию на шаги.
"backend/app/services/crud/payload.py" = ["PLR0911"]
"backend/app/services/report_engine.py" = ["PLR0911"]

[tool.coverage.run]
# Покрытие тестами backend: `pytest --cov` (CI печатает сводку в итог job и прикладывает coverage.xml). Ветви считаем:
# условие, не выполнявшееся ни в одну сторону, — тоже непокрытый код.
branch = true
source = ["backend/app"]

[tool.coverage.report]
# Порог: покрытие (строки и ветви) не должно падать ниже достигнутого. На 2.157.0 измерено 94 %; запас в два пункта
# оставлен на различия окружения CI (например, наличие LibreOffice для теста .vsdx). Поднимайте порог вместе с покрытием.
fail_under = 92
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
