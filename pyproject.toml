[tool.ruff]
line-length = 400
extend-exclude = ["frontend"]

[tool.ruff.lint]
# Только реальные ошибки: pyflakes (неиспользуемые/неопределённые имена и т.п.) + синтаксис.
# Полный дефолтный набор ruff (стиль импортов, длина строк, пробелы) конфликтует с сознательным
# плотным стилем автора (несколько операторов в строке через ';'/':'). Тот же выбор правил, что
# и в .github/workflows/ci.yml — вынесен сюда, чтобы `ruff check` без флагов (в т.ч. из IDE-
# плагина) давал тот же результат локально, что и CI, без необходимости помнить флаги команды.
select = ["F", "E9", "C901"]

[tool.ruff.lint.mccabe]
# Цикломатическая сложность функции не выше 12 (код-ревью, п. 10). Правило включено для всего проекта, чтобы новый
# код не усложнялся, а файлы с уже известным долгом перечислены ниже явно: убирайте файл из списка, когда его функции
# разобраны на шаги, — не добавляйте новые. Список — функции, оставшиеся после снижения сложности по п. 10 код-ревью (2026-10).
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*.py" = ["C901"]                 # исторические миграции не переписываем
"backend/app/reporting.py" = ["C901"]                    # _load_report_data (22), _connection_row_values_list (26)
"backend/app/services/diagram_export.py" = ["C901"]         # export_vsdx (16)
"backend/app/services/port_sync_reconcile.py" = ["C901"]    # _plan_target (13)
"backend/app/services/port_sync_rules.py" = ["C901"]        # rule_from_payload (19)
"backend/app/services/vlan_mode_cascade.py" = ["C901"]      # _load_details (16), apply_vlan_mode_cascade (18)
